<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Core Academic Portal — a Java-first academic analytics portfolio running in the browser." />
    <title>Core Academic Portal — Java Portfolio</title>
    <style>
      :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7f5;--green:#087a43;--ink:#172033;--muted:#718092;--card:#fff;--line:#dfe6e1}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8faf8,#edf3ee);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:28px 20px 50px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding:26px;border-radius:18px;background:linear-gradient(135deg,#07552e,#0d8b4c);color:#fff;box-shadow:0 18px 45px rgba(12,81,46,.18)}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;opacity:.8}h1,h2{margin:6px 0}header p{margin:0;opacity:.8;font-size:13px}.status{font-size:9px;font-weight:800;letter-spacing:.12em;padding:7px 10px;border:1px solid rgba(255,255,255,.3);border-radius:999px;white-space:nowrap}nav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}nav button,.actions button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 11px;border-radius:9px;font-size:11px;font-weight:700}nav button:hover,.actions button:hover{border-color:#acd1bb;color:var(--green)}main{min-height:400px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(24,49,34,.06);padding:20px;margin-bottom:14px}.hero{display:grid;grid-template-columns:1fr 260px;gap:20px;align-items:center}.hero p{color:var(--muted);line-height:1.6;font-size:12px}.hero-number{background:#eff8f2;border:1px solid #d6eadc;border-radius:14px;padding:18px}.hero-number small,.stat small{display:block;color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase}.hero-number strong,.stat strong{display:block;font-size:30px;margin:7px 0;color:var(--green)}.hero-number span{font-size:9px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}.stat strong{font-size:20px;color:var(--ink)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card h3{margin-top:0}.row,.risk{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf1ee;font-size:11px}.row:last-child,.risk:last-child{border-bottom:0}.row span,.risk small{color:var(--muted);display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.actions input,.actions select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:11px;outline:0}.toolbar input{min-width:230px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:10px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf1ee;white-space:nowrap}th{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}tr:hover td{background:#f9fbfa}td small{display:block;color:var(--muted);margin-top:2px}.bar{height:4px;background:#e8eee9;border-radius:99px;margin-top:5px;width:90px}.bar i{display:block;height:100%;background:var(--green);border-radius:99px}.pill{padding:4px 7px;border-radius:999px;font-size:8px;font-weight:800}.HONORS{background:#e4f5ea;color:#07552e}.GOOD{background:#eaf1fb;color:#245a9c}.SATISFACTORY{background:#fff6df;color:#9a6c00}.WARNING{background:#fff0db;color:#a65a00}.PROBATION{background:#fde8e8;color:#a22020}.detailHead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.detailHead p,.muted{color:var(--muted);font-size:11px}.big{font-size:30px;color:var(--green);display:block}.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.subjectGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin:14px 0}.subject{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fbfcfb}.subject strong{display:block;font-size:10px}.subject span{display:block;font-size:20px;font-weight:800;color:var(--green);margin:6px 0}.subject small{color:var(--muted);font-size:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:13px}.risk{padding:13px 0}.risk button{border:1px solid var(--line);background:#fff;padding:6px 9px;border-radius:8px;font-size:9px}.alert{padding:12px;border-radius:10px;background:#fff1f1;color:#9f2424;margin-bottom:12px}.legacy{max-width:1180px;margin:0 auto;padding:0 20px 60px}.legacy-card{background:#fff;border:1px solid #dfe6e1;border-radius:16px;padding:18px;box-shadow:0 12px 32px rgba(24,49,34,.06)}.legacy-note{color:#718092;font-size:11px;line-height:1.6;margin:6px 0 14px}.legacy-frame{display:block;width:100%;height:1100px;border:1px solid #dfe6e1;border-radius:10px;background:#080b0f}footer{padding:10px 2px;color:var(--muted);font-size:9px;text-align:center}@media(max-width:850px){.hero,.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.app{padding:14px}.legacy{padding:0 14px 40px}.stats,.mini{grid-template-columns:repeat(2,1fr)}header{padding:19px;flex-direction:column}.toolbar input{min-width:100%}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <section class="legacy" aria-labelledby="legacy-title">
      <div class="legacy-card">
        <span class="eyebrow">LEGACY VERSION</span>
        <h2 id="legacy-title">Student Grade Tracker</h2>
        <p class="legacy-note">The original Grade Tracker is preserved locally so it runs as a normal same-site page without embedding a raw GitHub response.</p>
        <iframe class="legacy-frame" src="./legacy/" title="Legacy Student Grade Tracker" loading="lazy"></iframe>
        <p class="legacy-note"><a href="./legacy/">Open legacy version directly</a></p>
      </div>
    </section>
    <script src="./teavm/classes.js"></script>
    <script>main();</script>
  </body>
</html>
